name: HimLab
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"          # у вас требование iOS 17
  createIntermediateGroups: true

targets:
  HimLab:
    type: application
    platform: iOS
    sources:
      - path: Sources    # сюда попадут все .swift и .json
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.himlab
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: 1
