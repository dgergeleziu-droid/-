name: Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Выбрать Xcode 15
        run: sudo xcode-select -s /Applications/Xcode_15.2.app

      - name: Установить xcodegen
        run: brew install xcodegen

      - name: Сгенерировать .xcodeproj из project.yml
        run: xcodegen generate

      - name: Собрать проект (симулятор)
        run: |
          xcodebuild \
            -project HimLab.xcodeproj \
            -scheme HimLab \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Прогнать unit-тесты
        run: |
          xcodebuild \
            -project HimLab.xcodeproj \
            -scheme HimLab \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            CODE_SIGNING_ALLOWED=NO \
            test
